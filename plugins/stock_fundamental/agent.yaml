apiVersion: agent-framework/v1
kind: Agent
name: stock_fundamental
version: 1.0.0
description: Analyzes the latest year of financial reports and estimates a fair-value range from fundamentals.
entrypoint: service:build_agent
port: 8025
capabilities:
  streaming: false
inputs:
  query: string
  market_data: optional<string>
outputs:
  artifact: string
